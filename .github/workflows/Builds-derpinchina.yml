name: 自动构建:Derpin-China

# 支持上海时区每周一零点定时执行、main 分支 PR 关闭事件及手动触发。
on:
  schedule:
    - cron: '0 0 * * 1'
      timezone: Asia/Shanghai
  pull_request:
    types: [ closed ]
    branches: [ main ]
  workflow_dispatch:

# 令牌仅授予读取仓库内容和向 GHCR 写入镜像包的权限。
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # PR 关闭事件仅在已合并时执行，其他触发方式正常执行。
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      IMAGE_NAME: derpin-china
      EVENT_NAME: ${{ github.event_name }}

    steps:
      # 检出当前仓库，为 Docker 构建提供源代码和构建上下文。
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      # 使用当前执行者和工作流令牌登录 GHCR，后续由独立步骤退出登录。
      - name: Login to GHCR
        id: login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      # 将仓库所有者转换为小写，满足镜像仓库路径要求。
      - name: Define Repo Owner Lower
        id: owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # 转换所有者名称，并写入后续步骤共享的环境变量。
          REPO_OWNER_LOWER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER_LOWER=$REPO_OWNER_LOWER" >> "$GITHUB_ENV"

      # 查询 Tailscale 最新发布版本，并校验版本标签格式。
      - name: Get latest Tailscale Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 携带令牌请求最新发布信息，HTTP 请求失败时终止步骤。
          RELEASE_JSON=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tailscale/tailscale/releases/latest)
          # 仅接受 v 前缀的三段数字版本，去除前缀后再次校验并供后续使用。
          TAILSCALE_VERSION=$(printf '%s' "$RELEASE_JSON" | jq -er '.tag_name | strings | select(test("^v[0-9]+[.][0-9]+[.][0-9]+\\z")) | ltrimstr("v")')
          [[ "$TAILSCALE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Latest Tailscale Version: $TAILSCALE_VERSION"
          echo "TAILSCALE_VERSION=$TAILSCALE_VERSION" >> "$GITHUB_ENV"

      # 生成版本镜像标签，PR 合并构建额外附加 PR 编号。
      - name: Generate Tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FINAL_TAG="v$TAILSCALE_VERSION"
          # 校验 PR 编号为纯数字后追加后缀，区分 PR 构建和常规版本。
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            FINAL_TAG="$FINAL_TAG-pr$PR_NUMBER"
          fi
          echo "Generated tag: $FINAL_TAG"
          echo "FINAL_TAG=$FINAL_TAG" >> "$GITHUB_ENV"

      # 检查远端版本标签，已存在时跳过后续构建和推送。
      - name: Check if the Image Exists
        id: check_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          IMAGE_URL="ghcr.io/$REPO_OWNER_LOWER/$IMAGE_NAME:$FINAL_TAG"
          # 认证查询镜像，仅将明确的清单或名称不存在视为需要构建。
          if INSPECT_ERROR=$(skopeo inspect --creds "$GH_ACTOR:$GH_TOKEN" "docker://$IMAGE_URL" 2>&1 >/dev/null); then
            IMAGE_EXISTS=true
          elif [[ "$INSPECT_ERROR" =~ (^|[^[:alnum:]_])(manifest\ unknown|name\ unknown)([^[:alnum:]_]|$) ]]; then
            IMAGE_EXISTS=false
          else
            # 鉴权、网络等其他错误直接报错，避免误判为镜像不存在。
            printf '%s\n' "$INSPECT_ERROR" >&2
            exit 1
          fi
          echo "Image tag exists: $IMAGE_EXISTS"
          echo "IMAGE_EXISTS=$IMAGE_EXISTS" >> "$GITHUB_ENV"

      # 镜像已存在时以失败状态终止，避免工作流显示成功。
      - name: Stop if image exists
        if: env.IMAGE_EXISTS == 'true'
        run: exit 1

      # 仅在远端标签不存在时构建镜像，并传入预期的 Derper 版本。
      - name: Build Docker Image
        id: build
        if: env.IMAGE_EXISTS == 'false'
        run: |
          set -euo pipefail
          docker build . --build-arg "DERP_VERSION=v$TAILSCALE_VERSION" -t derpinchina:latest

      # 启动临时容器，验证镜像内 Tailscale 和 Derper 均匹配预期版本。
      - name: Verify Tailscale and Derper Versions in Image
        id: verify_versions
        if: env.IMAGE_EXISTS == 'false'
        run: |
          set -euo pipefail
          CONTAINER_NAME="verify-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          # 退出时强制删除验证容器，收到中断或终止信号时以对应状态退出。
          trap 'docker rm -f "$CONTAINER_NAME" >/dev/null' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # 覆盖入口并短暂保持容器运行，以便执行版本查询命令。
          docker run -d --rm --name "$CONTAINER_NAME" --entrypoint sh derpinchina:latest -c 'sleep 300' >/dev/null
          # 提取 Tailscale 输出首行并去除可选 v 前缀，校验格式及版本一致性。
          TS_OUTPUT=$(docker exec "$CONTAINER_NAME" tailscale --version)
          TS_VERSION=${TS_OUTPUT%%$'\n'*}
          TS_VERSION=${TS_VERSION#v}
          [[ "$TS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TS_VERSION=$TS_VERSION" >> "$GITHUB_ENV"
          [[ "$TS_VERSION" == "$TAILSCALE_VERSION" ]]
          # 对 Derper 执行相同校验，并保存实际版本用于构建摘要。
          DERP_OUTPUT=$(docker exec "$CONTAINER_NAME" derper --version)
          DERP_VERSION=${DERP_OUTPUT%%$'\n'*}
          DERP_VERSION=${DERP_VERSION#v}
          [[ "$DERP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "DERP_VERSION=$DERP_VERSION" >> "$GITHUB_ENV"
          [[ "$DERP_VERSION" == "$TAILSCALE_VERSION" ]]

      # 为镜像添加版本标签，仅非 PR 构建同时更新 latest 标签。
      - name: Tag Image
        id: tag_image
        if: env.IMAGE_EXISTS == 'false'
        run: |
          set -euo pipefail
          IMAGE_URL="ghcr.io/$REPO_OWNER_LOWER/$IMAGE_NAME"
          docker tag derpinchina:latest "$IMAGE_URL:$FINAL_TAG"
          # PR 构建保留独立版本标签，不覆盖常规 latest 镜像。
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            docker tag derpinchina:latest "$IMAGE_URL:latest"
          fi

      # 仅在新构建完成且版本验证通过后推送版本标签镜像。
      - name: Push Image
        id: push_version
        if: env.IMAGE_EXISTS == 'false'
        run: docker push "ghcr.io/$REPO_OWNER_LOWER/$IMAGE_NAME:$FINAL_TAG"

      # 仅非 PR 的新构建推送 latest 标签镜像。
      - name: Push latest Image
        id: push_latest
        if: env.IMAGE_EXISTS == 'false' && github.event_name != 'pull_request'
        run: docker push "ghcr.io/$REPO_OWNER_LOWER/$IMAGE_NAME:latest"

      # 无论前面步骤成功、失败或取消，均尝试退出 GHCR 登录并清理凭据。
      - name: Logout from GHCR
        id: logout
        if: always()
        run: docker logout ghcr.io

      # 始终生成构建摘要，汇总步骤结果、推送状态、版本及运行详情。
      - name: Build Summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 按镜像已存在、取消、失败、版本推送成功的优先级确定构建状态。
          STATUS="跳过"
          STATUS_ICON="⏭️"
          if [[ "${IMAGE_EXISTS:-}" == "true" ]]; then
            STATUS="已终止"
            STATUS_ICON="❌"
          elif jq -e 'any(.[]; .outcome == "cancelled")' <<< "$STEPS_JSON" >/dev/null; then
            STATUS="取消"
            STATUS_ICON="⚠️"
          elif jq -e 'any(.[]; .outcome == "failure")' <<< "$STEPS_JSON" >/dev/null; then
            STATUS="失败"
            STATUS_ICON="❌"
          elif jq -e '.push_version.outcome == "success"' <<< "$STEPS_JSON" >/dev/null; then
            STATUS="成功"
            STATUS_ICON="✅"
          fi
          # 分别读取版本和 latest 推送结果，识别部分成功及取消等情况。
          PUSH_STATUS="跳过"
          VERSION_OUTCOME=$(jq -r '.push_version.outcome // "skipped"' <<< "$STEPS_JSON")
          LATEST_OUTCOME=$(jq -r '.push_latest.outcome // "skipped"' <<< "$STEPS_JSON")
          if [[ "$VERSION_OUTCOME" == "success" ]]; then
            # PR 无需推送 latest，其他触发方式须两个标签均推送成功。
            if [[ "$EVENT_NAME" == "pull_request" || "$LATEST_OUTCOME" == "success" ]]; then
              PUSH_STATUS="成功"
            else
              PUSH_STATUS="部分成功（版本标签已推送，latest 未成功）"
            fi
          elif [[ "$VERSION_OUTCOME" == "failure" ]]; then
            PUSH_STATUS="失败"
          elif [[ "$VERSION_OUTCOME" == "cancelled" ]]; then
            PUSH_STATUS="取消（远端状态需核实）"
          fi
          # 将状态、版本、镜像地址及运行链接追加到工作流摘要。
          {
            printf '## Docker镜像构建结果\n\n- %s **构建状态**: %s\n' "$STATUS_ICON" "$STATUS"
            if [[ "${IMAGE_EXISTS:-}" == "true" ]]; then
              printf -- '- ⚠️ **终止原因**: 镜像已存在\n'
            fi
            printf -- '- **推送状态**: %s\n' "$PUSH_STATUS"
            printf '\n### 版本与镜像\n- 预期 Tailscale: %s\n- 镜像 Tailscale: %s\n- Derper: %s\n' "${TAILSCALE_VERSION:-不可用}" "${TS_VERSION:-不可用}" "${DERP_VERSION:-不可用}"
            printf -- '- 镜像: ghcr.io/%s/%s:%s\n' "${REPO_OWNER_LOWER:-不可用}" "$IMAGE_NAME" "${FINAL_TAG:-不可用}"
            printf -- '- latest 镜像: ghcr.io/%s/%s:latest' "${REPO_OWNER_LOWER:-不可用}" "$IMAGE_NAME"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              printf '（PR 不更新 latest）'
            fi
            printf '\n'
            printf -- '- 提交: %s\n- UTC 时间: %s\n' "$COMMIT_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '\n### 构建详情\n- 构建 ID: %s\n- 触发方式: %s\n- 分支: %s\n- 工作流运行: %s/%s/actions/runs/%s\n' "$RUN_ID" "$EVENT_NAME" "$REF_NAME" "$SERVER_URL" "$REPOSITORY" "$RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
